version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: finmock_db
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: findb
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "33066:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - fin_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend:
    build:
      context: ./backend
    container_name: finmock_backend
    ports:
      - "8088:80"
    environment:
      DB_HOST: db
      DB_NAME: findb
      DB_USER: user
      DB_PASS: password
    depends_on:
      db:
        condition: service_healthy
    networks:
      - fin_network

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8088
    container_name: finmock_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - fin_network

networks:
  fin_network:
    driver: bridge

volumes:
  db_data:
